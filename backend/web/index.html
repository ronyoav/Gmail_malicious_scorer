<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Email Scorer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#6b7280; --border:#e4e7eb;
          --safe:#1a7f44; --susp:#b7791f; --bad:#b91c1c; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; }
  textarea { min-height:150px; resize:vertical; }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .verdict { font-size:15px; font-weight:600; padding:4px 10px; border-radius:999px; display:inline-block; }
  .v-safe { background:#e7f4ec; color:var(--safe); } .v-susp { background:#fbf3e3; color:var(--susp); } .v-bad { background:#fbe9e9; color:var(--bad); }
  .score { font-size:40px; font-weight:700; }
  .sig { font-size:13px; padding:6px 0; border-top:1px dashed var(--border); }
  .sev { font-size:11px; font-weight:700; text-transform:uppercase; margin-right:6px; }
  .sev-high{color:var(--bad);} .sev-medium{color:var(--susp);} .sev-low{color:var(--muted);}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Phishing Email Scorer</h1>
  <p class="sub">Paste an email below to get a phishing risk score. Results are saved to the scan history.</p>

  <div class="card">
    <label for="subject">Subject</label>
    <input id="subject" placeholder="e.g. Security alert for your account">
    <label for="from">From</label>
    <input id="from" placeholder="e.g. no-reply@accounts.google.com">
    <label for="body">Email body</label>
    <textarea id="body" placeholder="Paste the email text here (links are detected automatically)…"></textarea>
    <button id="go" onclick="analyze()">Analyze</button>
    <span id="err" style="color:var(--bad); margin-left:12px;"></span>
  </div>

  <div class="card" id="result" style="display:none"></div>

  <div class="card">
    <strong>Recent scans</strong>
    <div id="history" class="muted" style="margin-top:10px">Loading…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const vclass = v => v === "safe" ? "v-safe" : v === "suspicious" ? "v-susp" : "v-bad";

function extractUrls(text) {
  return [...new Set((text.match(/https?:\/\/[^\s"'<>)\]]+/gi) || []).map(u => u.replace(/[.,;]+$/, "")))];
}

async function analyze() {
  $("err").textContent = "";
  const body = $("body").value.trim();
  if (!body && !$("subject").value.trim()) { $("err").textContent = "Enter a subject or body first."; return; }
  $("go").disabled = true; $("go").textContent = "Analyzing…";
  try {
    const req = {
      message_id: "web-" + Date.now(),
      subject: $("subject").value,
      headers: { from_address: $("from").value || null },
      body_text: body || null,
      urls: extractUrls(body),
      attachments: []
    };
    const res = await fetch("/api/v1/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    loadHistory();
  } catch (e) {
    $("err").textContent = "Failed: " + e.message;
  } finally {
    $("go").disabled = false; $("go").textContent = "Analyze";
  }
}

function render(r) {
  const el = $("result");
  el.style.display = "block";
  const sigs = (r.signals || []).map(s =>
    `<div class="sig"><span class="sev sev-${s.severity}">${s.severity}</span>${escapeHtml(s.description)}</div>`
  ).join("") || '<div class="muted" style="margin-top:8px">No signals.</div>';
  el.innerHTML =
    `<div style="display:flex;align-items:center;gap:16px">
       <div class="score">${r.score}</div>
       <span class="verdict ${vclass(r.verdict)}">${escapeHtml(r.verdict_label)}</span>
     </div>
     <p style="margin:12px 0 4px">${escapeHtml(r.explanation || "")}</p>
     <div style="margin-top:8px">${sigs}</div>`;
}

async function loadHistory() {
  try {
    const rows = await (await fetch("/api/v1/history?limit=25")).json();
    if (!rows.length) { $("history").textContent = "No scans yet (or database not configured)."; return; }
    $("history").innerHTML =
      `<table><tr><th>When</th><th>Subject</th><th>From</th><th>Score</th><th>Verdict</th></tr>` +
      rows.map(r => `<tr>
        <td class="muted">${new Date(r.created_at).toLocaleString()}</td>
        <td>${escapeHtml(r.subject || "")}</td>
        <td class="muted">${escapeHtml(r.sender || "")}</td>
        <td>${r.score ?? ""}</td>
        <td>${escapeHtml(r.verdict_label || "")}</td>
      </tr>`).join("") + `</table>`;
  } catch (e) {
    $("history").textContent = "History unavailable.";
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadHistory();
</script>
</body>
</html>
