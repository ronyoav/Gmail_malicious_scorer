<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Email Scorer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#6b7280; --border:#e4e7eb;
          --safe:#1a7f44; --susp:#b7791f; --bad:#b91c1c; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; }
  textarea { resize:vertical; }
  textarea.raw { min-height:220px; font-family:ui-monospace,Consolas,monospace; font-size:12px; white-space:pre; }
  textarea.body { min-height:150px; }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hint { font-size:12px; color:var(--muted); margin:0 0 6px; }
  .verdict { font-size:15px; font-weight:600; padding:4px 10px; border-radius:999px; display:inline-block; }
  .v-safe { background:#e7f4ec; color:var(--safe); } .v-susp { background:#fbf3e3; color:var(--susp); } .v-bad { background:#fbe9e9; color:var(--bad); }
  .score { font-size:40px; font-weight:700; }
  .sig { font-size:13px; padding:6px 0; border-top:1px dashed var(--border); }
  .ghead { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:16px 0 2px; }
  .sev { font-size:11px; font-weight:700; text-transform:uppercase; margin-right:6px; }
  .sev-high{color:var(--bad);} .sev-medium{color:var(--susp);} .sev-low{color:var(--muted);}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Phishing Email Scorer</h1>
  <p class="sub">Score an email for phishing risk. Results are saved to the scan history.</p>

  <div class="card">
    <p class="hint">Gmail → open the email → ⋮ → <strong>Show original</strong> → Copy to clipboard, then paste here.
    This includes the headers, so SPF / DKIM / DMARC and relay checks run.</p>
    <textarea id="raw" class="raw" placeholder="Paste the full raw email source here…"></textarea>
    <div style="margin-top:10px">
      <label class="hint" for="file" style="display:block;cursor:pointer">…or upload a <strong>.eml</strong> / <strong>.txt</strong> file (loaded into the box above, then analyzed):</label>
      <input id="file" type="file" accept=".eml,.txt,message/rfc822,text/plain" onchange="loadFile(this)">
    </div>
    <button id="go-raw" onclick="analyzeRaw()">Analyze</button>
    <span id="err-raw" style="color:var(--bad); margin-left:12px;"></span>
  </div>

  <div class="card" id="result" style="display:none"></div>

  <div class="card">
    <strong>Recent scans</strong>
    <div id="history" class="muted" style="margin-top:10px">Loading…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const vclass = v => v === "safe" ? "v-safe" : v === "suspicious" ? "v-susp" : "v-bad";

async function post(url, payload, btn, errEl) {
  $(errEl).textContent = "";
  $(btn).disabled = true; const label = $(btn).textContent; $(btn).textContent = "Analyzing…";
  try {
    const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    showResult(await res.json());
    loadHistory();
  } catch (e) {
    $(errEl).textContent = "Failed: " + e.message;
  } finally {
    $(btn).disabled = false; $(btn).textContent = label;
  }
}

function analyzeRaw() {
  const raw = $("raw").value.trim();
  if (!raw) { $("err-raw").textContent = "Paste or upload the raw email first."; return; }
  if (!(window.ReadableStream && window.TextDecoder)) {
    return post("/api/v1/analyze-raw", { raw }, "go-raw", "err-raw");  // old browser fallback
  }
  stream("/api/v1/analyze-raw/stream", { raw }, "go-raw", "err-raw");
}

// Streams NDJSON events: deterministic signals render as each analyzer finishes,
// the final score (and LLM findings) replace the live view when `result` arrives.
async function stream(url, payload, btn, errEl) {
  $(errEl).textContent = "";
  $(btn).disabled = true; const label = $(btn).textContent; $(btn).textContent = "Analyzing…";
  const live = [];
  let llmRunning = false, done = false;
  showLive(live, llmRunning);
  try {
    const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buf += dec.decode(value, { stream:true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "signals") { live.push(...ev.signals); showLive(live, llmRunning); }
        else if (ev.type === "llm") { llmRunning = true; showLive(live, llmRunning); }
        else if (ev.type === "result") { done = true; showResult(ev); loadHistory(); }
        else if (ev.type === "error") throw new Error(ev.message);
      }
    }
    if (!done) throw new Error("stream ended early");
  } catch (e) {
    $(errEl).textContent = "Failed: " + e.message;
  } finally {
    $(btn).disabled = false; $(btn).textContent = label;
  }
}

function showLive(sigs, llmRunning) {
  const el = $("result");
  el.style.display = "block";
  el.innerHTML =
    `<div style="display:flex;align-items:center;gap:16px">
       <div class="score muted">…</div>
       <span class="verdict muted">Final score pending</span>
     </div>
     <div class="ghead">Rule engine · deterministic</div>
     ${sigs.length ? renderSigs(sigs) : '<div class="muted" style="margin-top:4px">Running checks…</div>'}
     <div class="ghead">AI content analysis · LLM</div>
     <div class="muted" style="margin-top:4px">${llmRunning ? "Analyzing content…" : "Waiting for VirusTotal…"}</div>`;
}

function loadFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { $("raw").value = reader.result; analyzeRaw(); };
  reader.onerror = () => { $("err-raw").textContent = "Couldn't read the file."; };
  reader.readAsText(f);
}

function renderSigs(list) {
  if (!list.length) return '<div class="muted" style="margin-top:4px">No signals.</div>';
  return list.map(s =>
    `<div class="sig"><span class="sev sev-${s.severity}">${s.severity}</span>${escapeHtml(s.description)}</div>`
  ).join("");
}

function showResult(r) {
  const el = $("result");
  el.style.display = "block";
  const all = r.signals || [];
  const ruleSigs = all.filter(s => (s.source || "rule") !== "llm");
  const llmSigs  = all.filter(s => (s.source || "rule") === "llm");
  el.innerHTML =
    `<div style="display:flex;align-items:center;gap:16px">
       <div class="score">${r.score}</div>
       <span class="verdict ${vclass(r.verdict)}">${escapeHtml(r.verdict_label)}</span>
     </div>
     <p style="margin:12px 0 4px">${escapeHtml(r.explanation || "")}</p>
     <div class="ghead">Rule engine · deterministic</div>${renderSigs(ruleSigs)}
     <div class="ghead">AI content analysis · LLM</div>${renderSigs(llmSigs)}`;
  el.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

async function loadHistory() {
  try {
    const rows = await (await fetch("/api/v1/history?limit=25")).json();
    if (!rows.length) { $("history").textContent = "No scans yet (or database not configured)."; return; }
    $("history").innerHTML =
      `<table><tr><th>When</th><th>Subject</th><th>From</th><th>Score</th><th>Verdict</th></tr>` +
      rows.map(r => `<tr>
        <td class="muted">${new Date(r.created_at).toLocaleString()}</td>
        <td>${escapeHtml(r.subject || "")}</td>
        <td class="muted">${escapeHtml(r.sender || "")}</td>
        <td>${r.score ?? ""}</td>
        <td>${escapeHtml(r.verdict_label || "")}</td>
      </tr>`).join("") + `</table>`;
  } catch (e) {
    $("history").textContent = "History unavailable.";
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadHistory();
</script>
</body>
</html>
